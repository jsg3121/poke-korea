  $formCode: String
  $month: String
) {
  getChampionsPokemonDetail(
    pokemonId: $pokemonId
    format: $format
    formCode: $formCode
    month: $month
  ) {
    ...ChampionsPokemonDetail
  }
}

query GetChampionsTeamCores(
  $format: ChampionsFormat!
  $size: Int
  $month: String
  $limit: Int
) {
  championsTeamCores(
    format: $format
    size: $size
    month: $month
    limit: $limit
  ) {
    ...ChampionsTeamCore
  }
}

query GetChampionsTournaments(
  $format: ChampionsFormat!
  $limit: Int
  $month: String
) {
  championsTournaments(format: $format, limit: $limit, month: $month) {
    ...ChampionsTournamentSummary
  }
}

query GetChampionsTournamentsWithTopTeam(
  $format: ChampionsFormat!
  $limit: Int
  $month: String
) {
  championsTournaments(format: $format, limit: $limit, month: $month) {
    ...ChampionsTournamentSummary
    teams {
      id
      rank
      playerName
      country
      wins
      losses
      slots {
        pokemonId
        formType
        formCode
        displayName
        rawName
        imagePath
      }
    }
  }
}

query GetChampionsTournamentDetail($externalId: String!) {
  championsTournamentDetail(externalId: $externalId) {
    ...ChampionsTournamentDetail
  }
}
