query PokemonDetail($pokemonId: ID!) {
  getPokemonDetail(pokemonId: $pokemonId) {
    id
    abilityId
    evolutionId
    generation
    name
    isEvolution
    isFormChange
    isMegaEvolution
    isRegionForm
    isGigantamax
    # 기본 제원(1.58.0). height는 데시미터, weight는 헥토그램 정수라
    # 표시 시 /10 변환이 필요하다(formatPokemonSpec 모듈에서 처리).
    genus
    height
    weight
    captureRate
    genderRate
    hatchCounter
    baseHappiness
    maxExperience
    eggGroups
    isLegendary
    isMythical
    # 전용기 전체(버전·습득법·폼 무관). 기존엔 레벨업/머신 목록을 순회해
    # signatureMoves=true를 필터링했는데, 그 방식은 현재 버전 러닝셋에 없는
    # 전용기를 누락시켰다(꿈트렁 소금절이, 갈라르 야도킹 썰렁개그 등).
    signatureSkills {
      skillId
      nameKo
      type
      damageType
      power
      accuracy
      pp
      isSignature
    }
    types
    number
    typePrimary
    typeSecondary
    pokemonStats {
      ...PokemonStats
    }
    pokemonAbilityList {
      ...PokemonAbilityList
    }
    learnableSkills {
      levelUpVersionGroupId
      machineVersionGroupId
      levelUpSkills {
        level
        skill {
          id
          identifier
          nameKo
          description
          firstGenerationId
          power
          accuracy
          pp
          type
          damageType
          signatureMoves
          zMoves
        }
      }
      machineSkills {
        skill {
          id
          identifier
          nameKo
          description
          firstGenerationId
          power
          accuracy
          pp
          type
          damageType
          signatureMoves
          zMoves
        }
      }
    }
    exclusiveZMoves {
      id
      zSkill {
        skillId
        nameKo
        type
        damageType
        power
        description
      }
      baseSkill {
        skillId
        nameKo
        type
        damageType
        power
      }
    }
    evolutionChain {
      stages {
        pokemonId
        name
        displayName
        imagePath
        regionFormCode
        number
        stage
      }
      edges {
        fromPokemonId
        fromDisplayName
        fromImagePath
        fromRegionFormCode
        fromNormalFormCode
        fromFormType
        fromFormIndex
        toPokemonId
        trigger
        triggerLabel
        description
        versionGroupId
        baseVersionGroupId
        baseVersionGroupName
        resultRegionFormCode
        resultNormalFormCode
        resultDisplayName
        resultImagePath
        resultFormType
        resultFormIndex
      }
      groups {
        groupKey
        groupFormType
        groupRegion
        groupOrder
        edges {
          fromPokemonId
          fromDisplayName
          fromImagePath
          fromRegionFormCode
          fromNormalFormCode
          fromFormType
          fromFormIndex
          toPokemonId
          trigger
          triggerLabel
          description
          versionGroupId
          baseVersionGroupId
          baseVersionGroupName
          resultRegionFormCode
          resultNormalFormCode
          resultDisplayName
          resultImagePath
          resultFormType
          resultFormIndex
        }
      }
    }
  }
}

