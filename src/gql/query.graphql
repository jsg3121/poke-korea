# 포켓몬이 등장하는 버전 그룹. 버전 선택 nav가 전체 목록을 필요로 하므로
# getPokemonLearnset(선택된 버전 하나만 반환)과 별도로 조회한다.
# order 내림차순(최신 우선) 정렬이 계약으로 보장되고 첫 항목이 isLatest=true다.
query GetVersionGroupsByPokemon(
  $pokemonId: Int!
  $formType: PokemonFormType
  $formIndex: Int
) {
  getVersionGroupsByPokemon(
    pokemonId: $pokemonId
    formType: $formType
    formIndex: $formIndex
  ) {
    versionGroupId
    displayName
    isLatest
    order
    generationId
    baseVersionGroupId
    baseVersionGroupName
    name
    nameKo
  }
}

# 기술이 존재하는 버전 그룹. order 내림차순(최신 우선) 정렬이 계약으로 보장되고,
# 첫 항목이 isLatest=true다. 삭제된 기술(isAvailable=false)만 있는 버전은 제외되므로
# 첫 항목이 곧 "이 기술의 최신 사용 가능 버전"이다.
# 기존 GetVersionGroups(filter에 6가지 용도 혼재)를 기술 상세에서 대체한다.
query GetVersionGroupsBySkill($skillId: Int!) {
  getVersionGroupsBySkill(skillId: $skillId) {
    versionGroupId
    displayName
    isLatest
    order
    generationId
    baseVersionGroupId
    name
    nameKo
    baseVersionGroupName
  }
}

# ========== Master Queries ==========
# 정적 마스터 데이터. 값이 늘어도 프론트 배포 없이 반영되도록 쿼리로 받는다.

# 습득법 목록. 레벨업·기술머신 2종에서 9종으로 확장됐고 앞으로도 늘 수 있어,
# 하드코딩 대신 이 목록을 기준으로 렌더한다. isExposed=false는 스핀오프(XD 정화 등)라
# 기본 숨김이며, 노출 정책은 백엔드 DB 컬럼이므로 양쪽 배포 없이 변경된다.
query GetLearnMethods {
  getLearnMethods {
    method
    nameKo
    displayOrder
    isExposed
  }
}

