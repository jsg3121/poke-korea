# 기술을 배우는 포켓몬 목록 (V2 — 통합 테이블 기반).
# 응답 형태는 레거시 getPokemonsBySkill과 동일하고 데이터 소스만 바뀌었다.
#
# 달라지는 점(모두 의도된 개선):
# - 알 기술·기술 가르침 등 신규 습득법이 methods 배열에 함께 나온다
#   (불꽃펀치 USUM 기준 TUTOR 0 → 100건)
# - 메가진화는 제외된다 — 메가는 기술을 새로 배우지 않고 원본 종의 러닝셋을
#   그대로 쓰므로 같은 종이 두 번 나오는 중복이었다
# - 폼 상속으로 생략됐던 폼이 복원된다
query GetPokemonsBySkill($input: GetPokemonsBySkillInput!) {
  getPokemonsBySkillV2(input: $input) {
    skillId
    skillName
    edges {
      cursor
      node {
        id
        pokemonId
        name
        number
        methods {
          method
        }
        versionGroupId
        formType
        formCode
        formName
        types
        region
        imagePath
      }
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    totalCount
  }
}

